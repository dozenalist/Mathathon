<text x="360.0" y="46.0" font-size="30" fill="#172c43" text-anchor="middle" font-weight="600">Walking along K, the distance crosses 1</text>
<text x="360.0" y="82.0" font-size="23" fill="#172c43" text-anchor="middle" font-weight="400">Somewhere in between, a ruler from z has length exactly 1.</text>
