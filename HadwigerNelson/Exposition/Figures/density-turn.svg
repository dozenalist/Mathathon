<title id="title">Turn the ruler slightly: tips land in a disk of radius two h</title><desc id="desc">The start disk of radius h around a is on the left. A fan of unit rulers leaves it in directions within angle h of u-zero. Their tips spread over a dashed disk of radius two h around b, drawn with the smaller radius-h disk faintly inside it; two tips land outside the small disk but still inside the dashed one, because a start offset and a turn add up. A dashed arc shows how far a tip travels when the ruler turns from one edge of the fan to the other.</desc>
