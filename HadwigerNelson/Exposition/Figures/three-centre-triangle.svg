<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" role="img" aria-labelledby="title desc">
<title id="title">Two support directions 60 degrees apart give three centres one unit apart</title><desc id="desc">Part of the unit circle around a centre x, drawn dashed. Two short thick blue arcs mark the support of a state B, around the directions b = 0 degrees and d = 60 degrees. The points y = x + e^(ib) and z = x + e^(id) lie on the circle. The sides xy and xz are radii of length 1, and the chord yz, drawn in red, also has length 1, so x, y and z form an equilateral triangle with side 1. The 60 degree angle at x is marked.</desc>
<rect width="720" height="580" fill="white"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="360.0" y="44.0" font-size="28" fill="#172c43" text-anchor="middle" font-weight="600">Two support directions 60° apart make a unit triangle</text>
<text x="360.0" y="78.0" font-size="21" fill="#172c43" text-anchor="middle" font-weight="400">b and d lie in the support of the K-state B at the centre x.</text>
