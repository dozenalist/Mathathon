<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
<title id="title">Walking along a segment, the distance to z passes through exactly 1</title><desc id="desc">A point z at the lower left and a horizontal segment K above it. One end of K is closer than 1 to z and the other is farther. Three rulers run from z to points of K, of lengths 0.9, exactly 1 (highlighted) and 1.1. A dashed arc of the unit circle around z crosses K at the end of the highlighted ruler.</desc>
