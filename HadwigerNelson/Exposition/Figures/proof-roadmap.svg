<svg xmlns="http://www.w3.org/2000/svg" width="520" height="680" viewBox="0 0 520 680" role="img" aria-labelledby="title description">
  <title id="title">The structure of the supplied five-colour contradiction</title>
  <desc id="description">Assume a proper five-colouring of the plane. Build a weak measurable colouring. Extract limiting angular palettes. Topology forces a cycle of colour transitions. Construct connected interfaces that exclude colour pairs. Rule out cycles of length three, four, or five. Reach a contradiction.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="520" height="680" rx="12" fill="#ffffff"/>
  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 260 91 V 109"/>
    <path d="M 260 187 V 205"/>
    <path d="M 260 283 V 301"/>
    <path d="M 260 379 V 397"/>
    <path d="M 260 475 V 493"/>
    <path d="M 260 571 V 589"/>
  </g>
  <g fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5">
    <rect x="24" y="16" width="472" height="72" rx="8"/>
    <rect x="24" y="112" width="472" height="72" rx="8"/>
    <rect x="24" y="208" width="472" height="72" rx="8"/>
    <rect x="24" y="304" width="472" height="72" rx="8"/>
    <rect x="24" y="400" width="472" height="72" rx="8"/>
    <rect x="24" y="496" width="472" height="72" rx="8"/>
    <rect x="24" y="592" width="472" height="72" rx="8"/>
  </g>
  <g fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle">
    <text x="260" y="46"><tspan x="260">Assume a proper five-colouring</tspan><tspan x="260" dy="26">of the plane</tspan></text>
    <text x="260" y="142"><tspan x="260">Build a weak</tspan><tspan x="260" dy="26">measurable colouring</tspan></text>
    <text x="260" y="238"><tspan x="260">Extract limiting</tspan><tspan x="260" dy="26">angular palettes</tspan></text>
    <text x="260" y="334"><tspan x="260">Topology forces a cycle</tspan><tspan x="260" dy="26">of colour transitions</tspan></text>
    <text x="260" y="430"><tspan x="260">Construct connected interfaces</tspan><tspan x="260" dy="26">that exclude colour pairs</tspan></text>
    <text x="260" y="526"><tspan x="260">Rule out cycles</tspan><tspan x="260" dy="26">of length 3, 4, or 5</tspan></text>
    <text x="260" y="635">Contradiction</text>
  </g>
</svg>
