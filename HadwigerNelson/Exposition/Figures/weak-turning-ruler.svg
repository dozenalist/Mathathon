<title id="title">A whole turn has bad fraction two thirds</title><desc id="desc">The pivot is half a unit left of a vertical colour boundary. The unit circle intersects the boundary at angles sixty and three hundred degrees. The solid red arc covers two hundred forty degrees with equal endpoint colours. The dashed blue arc covers one hundred twenty degrees with different endpoint colours.</desc>
