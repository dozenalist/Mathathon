name = "mathathon"
defaultTargets = ["Mathathon"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Mathathon"

# Rogers--Ramanujan (SAIR problem 127) proof modules.
# Added 2026-11-14 by Main so that `RogersRamanujan/Lean/*.lean` is compiled by a
# named target instead of being invisible to the default build. The modules here
# import only `Init`, so this library does NOT depend on Mathlib being built.
# Build:  lake build RogersRamanujan
[[lean_lib]]
name = "RogersRamanujan"

# ZetaFive correspondence lemmas (2026-11-14).
# Proves the parallel-construction correspondences of
# `formalization_inputs/2026-11-14-parallel-01a1dc21/zeta5_unified_framework.tex`:
# transport μ(P) = τ(x^5 P(-x^2)), the affine Gram pencil G(u) = G(v) + (u-v)M,
# and the change-of-basis determinant identity. Modules live under
# ZetaFive/Lean/Correspondences/ with the root module ZetaFive.lean.
# Build:  lake build ZetaFive
[[lean_lib]]
name = "ZetaFive"
globs = ["ZetaFive", "ZetaFive.+"]
