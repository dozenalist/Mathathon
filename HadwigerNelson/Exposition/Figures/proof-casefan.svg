<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
<title id="title">Every case of the extracted cycle ends in the same contradiction</title><desc id="desc">A top box, weak measurable five-colouring assumed, has one arrow down to a box for step 5, Proposition 7.1: a cycle of length 3, 4 or 5. Exactly three arrows leave that box, labelled length 5, length 4 and length 3, to boxes for Proposition 8.2 (six-direction pattern), Proposition 8.5 (antipodal pairs and parity) and Proposition 8.10 (Moser spindle). Each of the three has an arrow into one shared box marked contradiction. A grey bracket on the left marks steps 1 to 4 and 6 as inputs used inside the branches.</desc>
<rect width="720" height="560" fill="white"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="360.0" y="40.0" font-size="27" fill="#172c43" text-anchor="middle" font-weight="600">Every branch ends in the same contradiction</text>
<text x="360.0" y="72.0" font-size="19" fill="#63758a" text-anchor="middle" font-weight="400">The case fan of Theorem 1.4 (a diagram, not to scale)</text>
<rect id="assume" x="210.0" y="100.0" width="380" height="50" rx="10" fill="#eef1f5" stroke="#63758a" stroke-width="2.5"/>
<text x="400.0" y="132.0" font-size="18" fill="#172c43" text-anchor="middle" font-weight="600">Weak measurable five-colouring (assumed)</text>
<line class="arrow" data-id="assume-step5" x1="400.0" y1="150.0" x2="400.0" y2="188.0" stroke="#172c43" stroke-width="2.5"/>
<polygon points="400.0,188.0 405.2,177.2 394.8,177.2" fill="#172c43"/>
<rect id="step5" x="210.0" y="190.0" width="380" height="70" rx="10" fill="#e7f0fb" stroke="#235f9d" stroke-width="2.5"/>
<text x="400.0" y="221.0" font-size="18" fill="#172c43" text-anchor="middle" font-weight="600">Step 5: Proposition 7.1</text>
<text x="400.0" y="243.0" font-size="18" fill="#172c43" text-anchor="middle" font-weight="400">a cycle of length ℓ ∈ {3, 4, 5}</text>
<line class="arrow" data-id="step5-branch" x1="400.0" y1="260.0" x2="195.0" y2="330.0" stroke="#172c43" stroke-width="2.5"/>
<polygon points="195.0,330.0 206.9,331.4 203.5,321.6" fill="#172c43"/>
<text x="283.5" y="297.0" font-size="17" fill="#b33d39" text-anchor="end" font-weight="600">ℓ = 5</text>
<rect id="branch" x="100.0" y="332.0" width="190" height="66" rx="10" fill="#e7f0fb" stroke="#235f9d" stroke-width="2.5"/>
<text x="195.0" y="361.0" font-size="18" fill="#172c43" text-anchor="middle" font-weight="600">Proposition 8.2</text>
<text x="195.0" y="383.0" font-size="18" fill="#172c43" text-anchor="middle" font-weight="400">six-direction pattern</text>
<line class="arrow" data-id="branch-contra" x1="195.0" y1="398.0" x2="348.8" y2="452.0" stroke="#172c43" stroke-width="2.5"/>
<polygon points="348.8,452.0 340.3,443.5 336.8,453.3" fill="#172c43"/>
<line class="arrow" data-id="step5-branch" x1="400.0" y1="260.0" x2="400.0" y2="330.0" stroke="#172c43" stroke-width="2.5"/>
<polygon points="400.0,330.0 405.2,319.2 394.8,319.2" fill="#172c43"/>
<text x="414.0" y="297.0" font-size="17" fill="#b33d39" text-anchor="start" font-weight="600">ℓ = 4</text>
<rect id="branch" x="305.0" y="332.0" width="190" height="66" rx="10" fill="#e7f0fb" stroke="#235f9d" stroke-width="2.5"/>
<text x="400.0" y="361.0" font-size="18" fill="#172c43" text-anchor="middle" font-weight="600">Proposition 8.5</text>
<text x="400.0" y="383.0" font-size="18" fill="#172c43" text-anchor="middle" font-weight="400">antipodal pairs, parity</text>
<line class="arrow" data-id="branch-contra" x1="400.0" y1="398.0" x2="400.0" y2="452.0" stroke="#172c43" stroke-width="2.5"/>
<polygon points="400.0,452.0 405.2,441.2 394.8,441.2" fill="#172c43"/>
<line class="arrow" data-id="step5-branch" x1="400.0" y1="260.0" x2="605.0" y2="330.0" stroke="#172c43" stroke-width="2.5"/>
<polygon points="605.0,330.0 596.5,321.6 593.1,331.4" fill="#172c43"/>
<text x="516.5" y="297.0" font-size="17" fill="#b33d39" text-anchor="start" font-weight="600">ℓ = 3</text>
<rect id="branch" x="510.0" y="332.0" width="190" height="66" rx="10" fill="#e7f0fb" stroke="#235f9d" stroke-width="2.5"/>
<text x="605.0" y="361.0" font-size="18" fill="#172c43" text-anchor="middle" font-weight="600">Proposition 8.10</text>
<text x="605.0" y="383.0" font-size="18" fill="#172c43" text-anchor="middle" font-weight="400">Moser spindle</text>
<line class="arrow" data-id="branch-contra" x1="605.0" y1="398.0" x2="451.2" y2="452.0" stroke="#172c43" stroke-width="2.5"/>
<polygon points="451.2,452.0 463.2,453.3 459.7,443.5" fill="#172c43"/>
<rect id="contra" x="270.0" y="454.0" width="260" height="56" rx="10" fill="#fbe9e5" stroke="#b33d39" stroke-width="2.5"/>
<text x="400.0" y="489.0" font-size="18" fill="#172c43" text-anchor="middle" font-weight="600">Contradiction</text>
<path d="M 64 100 L 52 100 L 52 450 L 64 450" fill="none" stroke="#63758a" stroke-width="2.5"/>
<text x="38" y="275" font-size="15" fill="#63758a" text-anchor="middle" transform="rotate(-90 38 275)">steps 1–4 and 6: inputs used inside the branches</text>
<text x="360.0" y="538.0" font-size="18" fill="#172c43" text-anchor="middle" font-weight="600">Step 5 has no fourth outgoing arrow: the three cases are all the cases.</text>
</g></svg>
