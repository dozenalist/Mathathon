<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
<title id="title">Slide the ruler along u-zero</title><desc id="desc">Two disks of radius h, one centred at a and one at b, one unit apart. Six parallel unit rulers start inside the left disk and point in the direction u-zero; each endpoint lands inside the right disk at the same offset. Both disks are mostly colour i with a few specks of other colours.</desc>
<rect width="720" height="450" fill="white"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="360.0" y="46.0" font-size="31" fill="#172c43" text-anchor="middle" font-weight="600">Slide the ruler along u₀</text>
<text x="360.0" y="84.0" font-size="24" fill="#172c43" text-anchor="middle" font-weight="400">Every start in B(a,h) lands in B(b,h), the same disk slid one unit.</text>
<circle cx="180.0" cy="215.0" r="70.0" fill="#e7f0fb" stroke="#63758a" stroke-width="3" />
<circle cx="540.0" cy="215.0" r="70.0" fill="#e7f0fb" stroke="#63758a" stroke-width="3" />
